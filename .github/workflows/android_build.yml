name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Find Gradle wrapper
        id: gradle
        shell: bash
        run: |
          WRAPPER="$(find . -type f -name gradlew -not -path '*/.gradle/*' | head -n 1)"

          if [ -z "$WRAPPER" ]; then
            echo "Gradle wrapper (gradlew) hin argamne."
            echo "gradlew fi gradle/wrapper/ faayilota isaanii GitHub irratti ol-fe'i."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$WRAPPER")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          chmod +x "$WRAPPER"

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
