name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true

      - name: Install required Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Find and extract Android project
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found."
            exit 1
          fi

          echo "Using project ZIP: $ZIP_FILE"

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

          SETTINGS="$(find build-source -type f -name 'settings.gradle.kts' | head -n 1)"

          if [ -z "$SETTINGS" ]; then
            echo "settings.gradle.kts not found after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Fix Compose Compiler configuration
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          APP_GRADLE="app/build.gradle.kts"

          if [ ! -f "$APP_GRADLE" ]; then
            echo "app/build.gradle.kts not found."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/build.gradle.kts")
          text = path.read_text()

          plugin = '    id("org.jetbrains.kotlin.plugin.compose") version "2.0.21"\n'

          if 'org.jetbrains.kotlin.plugin.compose' not in text:
              marker = 'plugins {\n'
              if marker in text:
                  text = text.replace(marker, marker + plugin, 1)

          path.write_text(text)
          print("Compose Compiler plugin configuration checked.")
          PY

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nunu-Kunba-Health-Center-APK
          path: "${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
